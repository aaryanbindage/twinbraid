name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  # Launches the real app (simulated Codex + simulated local model) and captures what it renders.
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Launch app and capture screenshot
        shell: bash
        run: |
          npx electron . --demo --sim --shot=smoke.png --shot-delay=10000 --disable-gpu
          test -s smoke.png
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.os }}
          path: smoke.png
